<!DOCTYPE html>
<html>
<head>
  <title>Koala AFK Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>🐨 Koala</h2>
  <ul>
    <li>Dashboard</li>
    <li>Servers</li>
    <li>Voice</li>
    <li>Settings</li>
  </ul>
</div>

<div class="main">

  <div class="header">
    <h1>Discord AFK Panel</h1>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Status</h3>
      <p id="status">🟢 Online</p>
    </div>

    <div class="card">
      <h3>Ping</h3>
      <p id="ping">0ms</p>
    </div>

    <div class="card">
      <h3>RAM</h3>
      <p id="ram">0 MB</p>
    </div>

    <div class="card">
      <h3>Uptime</h3>
      <p id="uptime">0s</p>
    </div>

  </div>

  <div class="server-box">
    <h2>🏠 Server Bot</h2>
    <div id="servers"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
